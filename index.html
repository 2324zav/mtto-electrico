<!DOCTYPE html><html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Mtto Eléctrico - Motores</title><style>*{box-sizing:border-box}body{margin:0;font-family:Arial;background:#fff;color:#111}header{padding:16px;background:#111;color:#fff;display:flex;justify-content:space-between} .tabs{display:flex;gap:8px;padding:12px;background:#f5f5f5} .tab{padding:8px 16px;border-radius:8px;border:1px solid #ddd;background:#fff;cursor:pointer} .tab.active{background:#111;color:#fff} .card{border:1px solid #e5e5e5;border-radius:12px;padding:16px;margin:12px;background:#fff} input,select,textarea{width:100%;padding:10px;margin:6px 0;border:1px solid #ddd;border-radius:8px}</style></head><body><header><b>Mtto Eléctrico - Motores</b><span>2324zav</span></header><div class="tabs"><button class="tab active" onclick="showTab('motores')">Motores</button><button class="tab" onclick="showTab('maintenance')">Maintenance</button><button class="tab" onclick="showTab('publico')">Motor Público</button></div><div id="motores" class="panel"><div class="card"><h3>Soplador B sx 4</h3><p>300 HP - 440V - 1785 RPM - Frame 449T</p><input id="search" placeholder="Buscar motor..." oninput="filtrar()"></div><div id="lista"></div></div><div id="maintenance" class="panel" style="display:none"><div class="card"><h3>Nuevo Mantenimiento</h3><input id="mNombre" placeholder="Nombre motor"><input id="mPot" placeholder="Potencia"><textarea id="mObs" placeholder="Observaciones"></textarea><button onclick="guardar()" style="padding:12px;background:#111;color:#fff;border-radius:8px;width:100%">Guardar (Ilimitado)</button></div></div><div id="publico" class="panel" style="display:none"><div class="card"><h3>Vista Invitado</h3><p>Solo lectura para invitados</p><div id="listaPub"></div></div></div><script>let motores=JSON.parse(localStorage.getItem('motores_v2')||'[{"nombre":"Soplador B sx 4","hp":"300 HP","v":"440V","rpm":"1785 RPM","frame":"449T"}]');function render(){const q=(document.getElementById('search')?.value||'').toLowerCase();let html='';motores.filter(m=>m.nombre.toLowerCase().includes(q)).forEach((m,i)=>{html+=`<div class=card><b>${m.nombre}</b><br>${m.hp} - ${m.v} - ${m.rpm} - ${m.frame}<br><small onclick="borrar(${i})" style="color:red;cursor:pointer">Borrar</small></div>`});document.getElementById('lista').innerHTML=html;document.getElementById('listaPub').innerHTML=html}function showTab(t){document.querySelectorAll('.panel').forEach(p=>p.style.display='none');document.getElementById(t).style.display='block';document.querySelectorAll('.tab').forEach(b=>b.classList.remove('active'));event.target.classList.add('active');}function guardar(){const n=document.getElementById('mNombre').value;if(!n)return alert('Pon nombre');motores.push({nombre:n,hp:document.getElementById('mPot').value||'N/A',v:'440V',rpm:'',frame:''});localStorage.setItem('motores_v2',JSON.stringify(motores));render();alert('Guardado ilimitado');showTab('motores');document.getElementById('motores').style.display='block'}function borrar(i){motores.splice(i,1);localStorage.setItem('motores_v2',JSON.stringify(motores));render()}function filtrar(){render()}render();</script></body></html>
