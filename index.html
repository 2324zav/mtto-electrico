<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Mtto Eléctrico - Motores</title>
<script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Inter,Arial,sans-serif;background:#fff;color:#0f172a}
header{padding:16px;background:#0f172a;color:#fff;display:flex;justify-content:space-between;align-items:center}
.tabs{display:flex;gap:8px;padding:12px;background:#f8fafc;border-bottom:1px solid #e2e8f0}
.tab{padding:8px 16px;border-radius:20px;border:1px solid #e2e8f0;background:#fff;cursor:pointer;font-weight:600}
.tab.active{background:#0f172a;color:#fff}
.card{border:1px solid #e2e8f0;border-radius:12px;padding:16px;margin:12px;background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.05)}
input,select,textarea{width:100%;padding:10px;margin:6px 0;border:1px solid #cbd5e1;border-radius:8px}
button{cursor:pointer}
.login{max-width:380px;margin:80px auto;padding:24px;border:1px solid #e2e8f0;border-radius:16px;background:#fff}
.badge{background:#dbeafe;color:#1e40af;padding:4px 8px;border-radius:8px;font-size:12px}
.hide{display:none}
.qr-modal{position:fixed;inset:0;background:rgba(0,0,0,.5);display:flex;align-items:center;justify-content:center}
.qr-box{background:#fff;padding:20px;border-radius:16px;text-align:center;max-width:360px;width:90%}
</style>
</head>
<body>
<div id="loginScreen" class="login">
<h2>Acceso Planta</h2>
<p style="font-size:13px;color:#64748b">Solo personal autorizado puede modificar</p>
<input id="email" type="email" placeholder="planta@detergentes.com" value="planta@detergentes.com">
<input id="pass" type="password" placeholder="Contraseña" value="">
<button onclick="login()" style="width:100%;padding:12px;background:#0f172a;color:#fff;border-radius:8px;margin-top:10px">Entrar</button>
<p id="loginErr" style="color:red;font-size:12px"></p>
<p style="font-size:11px;color:#64748b;margin-top:12px">Invitado: escanea QR del motor, entra sin login en modo solo lectura</p>
</div>

<div id="app" class="hide">
<header><b>Mtto Eléctrico - Motores</b><div><span id="userLabel" style="font-size:12px;margin-right:10px"></span><button onclick="logout()" style="padding:6px 10px;border-radius:8px;background:#fff;color:#0f172a;border:0">Salir</button></div></header>
<div class="tabs">
<button class="tab active" onclick="showTab('motores',this)">Motores</button>
<button class="tab" onclick="showTab('maintenance',this)" id="tabMaint">Maintenance</button>
<button class="tab" onclick="showTab('publico',this)">Motor Público</button>
</div>
<div id="motores" class="panel">
<div class="card">
<h3 style="margin:0">Motores Detergentes</h3>
<input id="search" placeholder="Buscar por nombre, HP, área..." oninput="render()">
<div id="addBox" class="card" style="margin:12px 0;background:#f8fafc">
<h4 style="margin:0 0 8px 0">Nuevo Motor</h4>
<input id="mNombre" placeholder="Nombre ej: Soplador B sx 4">
<input id="mHP" placeholder="HP ej: 300 HP">
<input id="mV" placeholder="Voltaje ej: 440V">
<input id="mRPM" placeholder="RPM ej: 1785 RPM">
<input id="mFrame" placeholder="Frame ej: 449T">
<input id="mArea" placeholder="Área ej: Sulfurex 4">
<button onclick="guardarMotor()" style="width:100%;padding:10px;background:#0f172a;color:#fff;border-radius:8px;margin-top:6px">Guardar Motor (Ilimitado)</button>
</div>
</div>
<div id="lista"></div>
</div>
<div id="maintenance" class="panel" style="display:none">
<div class="card"><h3>Historial Mantenimiento</h3><p style="font-size:13px;color:#64748b">Registro de trabajos realizados</p><div id="listaMaint"></div></div>
</div>
<div id="publico" class="panel" style="display:none">
<div class="card"><h3>Vista Invitado</h3><p id="guestMsg" style="font-size:13px;color:#64748b">Solo lectura</p><div id="listaPub"></div></div>
</div>
</div>

<div id="qrModal" class="qr-modal hide"><div class="qr-box"><h3>QR Invitado</h3><div id="qrcode" style="display:flex;justify-content:center;margin:12px 0"></div><input id="qrLink" readonly><button onclick="copyQR()" style="width:100%;padding:8px;background:#0f172a;color:#fff;border-radius:8px;margin-top:8px">Copiar Link</button><button onclick="closeQR()" style="width:100%;padding:8px;background:#fff;border:1px solid #ddd;border-radius:8px;margin-top:8px">Cerrar</button></div></div>

<script>
const USER = {email:"planta@detergentes.com", pass:"detergentes2026!"};
let motores = JSON.parse(localStorage.getItem('motores_v2')||'[{"id":"1","nombre":"Soplador B sx 4","hp":"300 HP","voltaje":"440V","rpm":"1785 RPM","frame":"449T","area":"Sulfurex 4"}]');
let isGuest = false;
let guestMotorId = null;

function checkAuth(){
 const urlParams = new URLSearchParams(window.location.search);
 if(urlParams.get('guest')==='1'){
   isGuest=true;
   guestMotorId=urlParams.get('motor');
   document.getElementById('loginScreen').classList.add('hide');
   document.getElementById('app').classList.remove('hide');
   document.getElementById('userLabel').innerText='Invitado QR - Solo Lectura';
   document.getElementById('addBox').classList.add('hide');
   document.getElementById('tabMaint').classList.add('hide');
   document.getElementById('guestMsg').innerText='Modo Invitado por QR - Solo visualización, sin edición';
   render();
   showTab('publico', document.querySelectorAll('.tab')[2]);
   document.getElementById('publico').style.display='block';
   return;
 }
 const saved = localStorage.getItem('auth_planta');
 if(saved){
   document.getElementById('loginScreen').classList.add('hide');
   document.getElementById('app').classList.remove('hide');
   document.getElementById('userLabel').innerText=saved;
   render();
 }
}
function login(){
 const e=document.getElementById('email').value.trim().toLowerCase();
 const p=document.getElementById('pass').value;
 if(e===USER.email && p===USER.pass){
   localStorage.setItem('auth_planta', e);
   document.getElementById('loginScreen').classList.add('hide');
   document.getElementById('app').classList.remove('hide');
   document.getElementById('userLabel').innerText=e;
   render();
 }else{
   document.getElementById('loginErr').innerText='Correo o contraseña incorrecta';
 }
}
function logout(){
 localStorage.removeItem('auth_planta');
 location.href=location.pathname;
}
function showTab(id, btn){
 document.querySelectorAll('.panel').forEach(p=>p.style.display='none');
 document.getElementById(id).style.display='block';
 document.querySelectorAll('.tab').forEach(b=>b.classList.remove('active'));
 if(btn) btn.classList.add('active');
}
function guardarMotor(){
 const nombre=document.getElementById('mNombre').value.trim();
 if(!nombre) return alert('Pon nombre');
 const m={id:Date.now().toString(), nombre, hp:document.getElementById('mHP').value||'N/A', voltaje:document.getElementById('mV').value||'440V', rpm:document.getElementById('mRPM').value||'', frame:document.getElementById('mFrame').value||'', area:document.getElementById('mArea').value||''};
 motores.push(m);
 localStorage.setItem('motores_v2', JSON.stringify(motores));
 ['mNombre','mHP','mV','mRPM','mFrame','mArea'].forEach(i=>document.getElementById(i).value='');
 render();
 alert('Motor guardado - Ilimitado');
}
function borrarMotor(id){
 if(!confirm('¿Borrar motor?')) return;
 motores=motores.filter(x=>x.id!==id);
 localStorage.setItem('motores_v2', JSON.stringify(motores));
 render();
}
function render(){
 const q=(document.getElementById('search')?.value||'').toLowerCase();
 let filtered = motores;
 if(guestMotorId){ filtered = motores.filter(m=>m.id===guestMotorId); }
 else { filtered = motores.filter(m=> (m.nombre+' '+m.hp+' '+(m.area||'')).toLowerCase().includes(q)); }
 let html='';
 filtered.forEach(m=>{
   html+=`<div class="card"><div style="display:flex;justify-content:space-between"><b>${m.nombre}</b><span class="badge">${m.hp}</span></div><div style="font-size:13px;color:#475569;margin-top:6px">${m.voltaje} - ${m.rpm} - Frame ${m.frame}<br>Área: ${m.area||'-'}</div>`;
   if(!isGuest){
     html+=`<div style="display:flex;gap:8px;margin-top:10px"><button onclick="generarQR('${m.id}')" style="padding:6px 10px;border-radius:8px;background:#fff;border:1px solid #0f172a">Generar QR</button><button onclick="borrarMotor('${m.id}')" style="padding:6px 10px;border-radius:8px;background:#fee2e2;border:1px solid #fecaca;color:#b91c1c">Borrar</button></div>`;
   } else {
     html+=`<div style="margin-top:8px;font-size:11px;color:#16a34a">✔ Acceso invitado - solo lectura</div>`;
   }
   html+=`</div>`;
 });
 const listaEl = document.getElementById('lista');
 const pubEl = document.getElementById('listaPub');
 if(listaEl) listaEl.innerHTML=html;
 if(pubEl) pubEl.innerHTML=html;
 document.getElementById('listaMaint').innerHTML = motores.map(m=>`<div style="padding:8px;border-bottom:1px solid #eee"><b>${m.nombre}</b> - ${m.hp} - ${m.area||''}</div>`).join('');
}
function generarQR(id){
 const base = location.origin + location.pathname;
 const link = base + '?guest=1&motor=' + id;
 document.getElementById('qrModal').classList.remove('hide');
 document.getElementById('qrLink').value=link;
 document.getElementById('qrcode').innerHTML='';
 new QRCode(document.getElementById('qrcode'), {text:link, width:180, height:180});
}
function closeQR(){ document.getElementById('qrModal').classList.add('hide'); }
function copyQR(){ navigator.clipboard.writeText(document.getElementById('qrLink').value); alert('Link copiado'); }
checkAuth();
</script>
</body>
</html>
